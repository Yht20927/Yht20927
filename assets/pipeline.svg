<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d16"/>
      <stop offset="0.5" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="titleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.6" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <style>
    .fps{font-family:"Fira Code","Cascadia Code",Menlo,Consolas,monospace}
    .cn{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Fira Code",sans-serif}
    @keyframes flow{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(38px);opacity:0}}
    @keyframes railFlow{0%{transform:translateX(0)}100%{transform:translateX(1030px)}}
    @keyframes dashC{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-24}}
    @keyframes pulse{0%,100%{opacity:1}42%{opacity:0.45}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes glowB{0%,100%{opacity:0.35}50%{opacity:0.9}}
    .flow{animation:flow 1.7s linear infinite}
    .rf{animation:railFlow 4.4s linear infinite}
    .dash{stroke-dasharray:5 7;animation:dashC 1.1s linear infinite}
    .halo{animation:glowB 2.6s ease-in-out infinite}
    .n1{animation:bob 3.2s ease-in-out infinite}
    .n2{animation:bob 3.6s ease-in-out infinite;animation-delay:-0.6s}
    .n3{animation:bob 3.0s ease-in-out infinite;animation-delay:-1.2s}
    .n4{animation:bob 3.4s ease-in-out infinite;animation-delay:-1.8s}
    .n5{animation:bob 3.8s ease-in-out infinite;animation-delay:-0.9s}
    .n6{animation:bob 3.3s ease-in-out infinite;animation-delay:-2.2s}
    .pl{animation:pulse 2.4s ease-in-out infinite}
  </style>

  <rect width="1100" height="300" fill="url(#bg)"/>

  <!-- corner brackets -->
  <g stroke="#a78bfa" stroke-width="2.6" fill="none" opacity="0.5">
    <path d="M20 42 V20 H42"/>
    <path d="M1080 42 V20 H1058"/>
    <path d="M20 258 V280 H42"/>
    <path d="M1080 258 V280 H1058"/>
  </g>

  <!-- header -->
  <text class="fps" x="34" y="40" font-size="20" font-weight="700" letter-spacing="2" fill="url(#titleG)">AI VIDEO PIPELINE</text>
  <text class="cn" x="1066" y="40" text-anchor="end" font-size="15" fill="#8b95ad">一句话想法 → 成片</text>
  <line x1="34" y1="56" x2="1066" y2="56" stroke="#1e2b45"/>

  <!-- stage nodes -->
  <g class="fps">
    <g class="n1">
      <rect x="35" y="86" width="130" height="112" rx="10" fill="#0f1424" stroke="#22d3ee" stroke-width="1.4"/>
      <rect x="35" y="86" width="130" height="3" rx="1.5" fill="#22d3ee"/>
      <text x="100" y="130" text-anchor="middle" font-size="30">💡</text>
      <text class="cn" x="100" y="164" text-anchor="middle" font-size="16" fill="#e2e8f0">一句话想法</text>
      <text x="100" y="184" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#22d3ee">IDEA</text>
    </g>
    <g class="n2">
      <rect x="215" y="86" width="130" height="112" rx="10" fill="#0f1424" stroke="#22d3ee" stroke-width="1.4"/>
      <rect x="215" y="86" width="130" height="3" rx="1.5" fill="#22d3ee"/>
      <text x="280" y="130" text-anchor="middle" font-size="30">📝</text>
      <text class="cn" x="280" y="164" text-anchor="middle" font-size="16" fill="#e2e8f0">口播稿</text>
      <text x="280" y="184" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#22d3ee">SCRIPT</text>
    </g>
    <g class="n3">
      <rect x="395" y="86" width="130" height="112" rx="10" fill="#0f1424" stroke="#a78bfa" stroke-width="1.4"/>
      <rect x="395" y="86" width="130" height="3" rx="1.5" fill="#a78bfa"/>
      <text x="460" y="130" text-anchor="middle" font-size="30">🎙</text>
      <text class="cn" x="460" y="164" text-anchor="middle" font-size="16" fill="#e2e8f0">整篇配音</text>
      <text x="460" y="184" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#a78bfa">TTS</text>
    </g>
    <g class="n4">
      <rect x="575" y="86" width="130" height="112" rx="10" fill="#0f1424" stroke="#a78bfa" stroke-width="1.4"/>
      <rect x="575" y="86" width="130" height="3" rx="1.5" fill="#a78bfa"/>
      <text x="640" y="130" text-anchor="middle" font-size="30">🎯</text>
      <text class="cn" x="640" y="164" text-anchor="middle" font-size="16" fill="#e2e8f0">音频对齐</text>
      <text x="640" y="184" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#a78bfa">WHISPER</text>
    </g>
    <g class="n5">
      <rect x="755" y="86" width="130" height="112" rx="10" fill="#0f1424" stroke="#f472b6" stroke-width="1.4"/>
      <rect x="755" y="86" width="130" height="3" rx="1.5" fill="#f472b6"/>
      <text x="820" y="130" text-anchor="middle" font-size="30">🎨</text>
      <text class="cn" x="820" y="164" text-anchor="middle" font-size="16" fill="#e2e8f0">富视觉渲染</text>
      <text x="820" y="184" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#f472b6">VISUAL</text>
    </g>
    <g class="n6">
      <rect x="935" y="86" width="130" height="112" rx="10" fill="#111527" stroke="#f472b6" stroke-width="1.4"/>
      <rect x="935" y="86" width="130" height="3" rx="1.5" fill="#f472b6"/>
      <text x="1000" y="130" text-anchor="middle" font-size="30">🎬</text>
      <text class="cn" x="1000" y="164" text-anchor="middle" font-size="16" fill="#e2e8f0">成片</text>
      <text x="1000" y="184" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#f472b6">4K MP4</text>
    </g>
  </g>

  <!-- connectors + traveling packets -->
  <g>
    <line class="dash" x1="171" y1="142" x2="209" y2="142" stroke="#22d3ee" stroke-width="1.6" opacity="0.6"/>
    <line class="dash" x1="351" y1="142" x2="389" y2="142" stroke="#22d3ee" stroke-width="1.6" opacity="0.6"/>
    <line class="dash" x1="531" y1="142" x2="569" y2="142" stroke="#a78bfa" stroke-width="1.6" opacity="0.6"/>
    <line class="dash" x1="711" y1="142" x2="749" y2="142" stroke="#a78bfa" stroke-width="1.6" opacity="0.6"/>
    <line class="dash" x1="891" y1="142" x2="929" y2="142" stroke="#f472b6" stroke-width="1.6" opacity="0.6"/>

    <g filter="url(#soft)">
      <circle class="flow" cx="175" cy="142" r="4" fill="#22d3ee"/>
      <circle class="flow" cx="355" cy="142" r="4" fill="#22d3ee" style="animation-delay:-0.35s"/>
      <circle class="flow" cx="535" cy="142" r="4" fill="#a78bfa" style="animation-delay:-0.7s"/>
      <circle class="flow" cx="715" cy="142" r="4" fill="#a78bfa" style="animation-delay:-1.05s"/>
      <circle class="flow" cx="895" cy="142" r="4" fill="#f472b6" style="animation-delay:-1.4s"/>
    </g>
  </g>

  <!-- progress rail -->
  <line x1="35" y1="236" x2="1065" y2="236" stroke="#1e2b45" stroke-width="3"/>
  <line class="halo" x1="35" y1="236" x2="1065" y2="236" stroke="url(#rail)" stroke-width="3"/>
  <g filter="url(#soft)">
    <circle class="rf" cx="35" cy="236" r="4" fill="#22d3ee"/>
  </g>
  <g fill="#1e2b45">
    <rect x="99" y="231" width="2" height="10"/>
    <rect x="279" y="231" width="2" height="10"/>
    <rect x="459" y="231" width="2" height="10"/>
    <rect x="639" y="231" width="2" height="10"/>
    <rect x="819" y="231" width="2" height="10"/>
    <rect x="999" y="231" width="2" height="10"/>
  </g>

  <!-- footer -->
  <text class="cn" x="46" y="272" font-size="13" fill="#5b6478">audio-first · deterministic render · 非网页风成片</text>
  <circle class="pl" cx="890" cy="268" r="3.4" fill="#4ade80"/>
  <text class="fps" x="1066" y="272" text-anchor="end" font-size="13" fill="#4ade80" letter-spacing="1">PIPELINE READY</text>
</svg>
