<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d16"/>
      <stop offset="0.5" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <style>
    .fps{font-family:"Fira Code","Cascadia Code",Menlo,Consolas,monospace}
    .cn{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Fira Code",sans-serif}
    @keyframes ping{0%{opacity:0;transform:scale(1)}7%{opacity:0.85}34%{opacity:0}100%{opacity:0}}
    @keyframes comet{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(880px);opacity:0}}
    @keyframes dashC{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-28}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ping 6s linear infinite}
    .comet{animation:comet 6s linear infinite}
    .dash{stroke-dasharray:4 8;animation:dashC 1.3s linear infinite}
    .pl{animation:pulse 2.2s ease-in-out infinite}
  </style>

  <rect width="1100" height="330" fill="url(#bg)"/>

  <!-- corner brackets -->
  <g stroke="#22d3ee" stroke-width="2.6" fill="none" opacity="0.45">
    <path d="M20 40 V20 H42"/>
    <path d="M1080 40 V20 H1058"/>
    <path d="M20 290 V310 H42"/>
    <path d="M1080 290 V310 H1058"/>
  </g>

  <!-- header -->
  <text class="fps" x="34" y="32" font-size="18" font-weight="700" letter-spacing="2" fill="#a78bfa">MISSION LOG</text>
  <text class="fps" x="196" y="32" font-size="14" fill="#5b6478">2026.04 → 2026.08</text>
  <text class="cn" x="1066" y="32" text-anchor="end" font-size="14" fill="#8b95ad">8 个节点 · 全部真实浏览器驱动</text>
  <line x1="34" y1="44" x2="1066" y2="44" stroke="#1e2b45"/>

  <!-- axis -->
  <line x1="110" y1="170" x2="990" y2="170" stroke="#1e2b45" stroke-width="3"/>
  <line class="dash" x1="110" y1="170" x2="990" y2="170" stroke="url(#axis)" stroke-width="3"/>
  <g filter="url(#soft)">
    <circle class="comet" cx="110" cy="170" r="4.5" fill="#22d3ee"/>
  </g>

  <!-- ============ above-axis cards (even index) ============ -->
