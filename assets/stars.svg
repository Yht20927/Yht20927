    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
    .blink{animation:blink 1.2s steps(1) infinite}
    .pl{animation:pulse 2.2s ease-in-out infinite}
  </style>

  <rect width="1100" height="470" fill="url(#bg)"/>
