<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d16"/>
      <stop offset="0.55" stop-color="#0e1020"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#18203a" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#0b0d16" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060c" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="glowL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="titleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf2f8"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="sheen" x1="-0.6" y1="0" x2="-0.2" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.8;1.8" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.6;2.0" dur="4.6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="eqGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glowT" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStar" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .fps{font-family:"Fira Code","Cascadia Code",Menlo,Consolas,monospace}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes glitchA{0%,92%,100%{transform:translate(0,0)}94%{transform:translate(-6px,1px)}96%{transform:translate(5px,-1px)}98%{transform:translate(-3px,0)}}
    @keyframes glitchB{0%,92%,100%{transform:translate(0,0)}93%{transform:translate(6px,-1px)}95%{transform:translate(-5px,1px)}97%{transform:translate(4px,0)}}
    @keyframes titleFlicker{0%,97%,100%{opacity:1}98%{opacity:0.55}99%{opacity:1}}
    @keyframes sweep{0%{transform:translateY(-140px)}100%{transform:translateY(480px)}}
    @keyframes eq{0%,100%{transform:scaleY(0.2)}50%{transform:scaleY(1)}}
    @keyframes pulseChip{0%,100%{opacity:1}50%{opacity:0.45}}
    @keyframes dashC{0%{stroke-dashoffset:0}100%{stroke-dashoffset:120}}
    @keyframes dotp{0%,100%{opacity:1}50%{opacity:0.25}}
    @keyframes crossp{0%,100%{opacity:0.18}50%{opacity:0.7}}
    .eq-bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.15s ease-in-out infinite}
    .blink{animation:blink 1s steps(1) infinite}
    .sweep{animation:sweep 3.4s linear infinite}
    .ga{animation:glitchA 3.6s steps(1) infinite}
    .gb{animation:glitchB 3.6s steps(1) infinite}
    .tf{animation:titleFlicker 5s steps(1) infinite}
    .chip{animation:pulseChip 2.4s ease-in-out infinite}
    .dot{animation:dotp 1.4s ease-in-out infinite}
    .dash{stroke-dasharray:8 6;animation:dashC 1.2s linear infinite}
    .cross{animation:crossp 3.2s ease-in-out infinite}
  </style>

  <!-- bg -->
  <rect width="1100" height="340" fill="url(#bg)"/>
  <rect width="1100" height="340" fill="url(#grid)" opacity="0.55"/>
  <rect width="1100" height="340" fill="url(#vig)"/>
  <!-- faint scanline overlay -->
  <g class="sweep" opacity="0.5">
    <rect x="-40" y="0" width="1180" height="90" fill="url(#eqGlow)"/>
  </g>

  <!-- HUD crosses -->
  <g stroke="#22d3ee" stroke-width="1.2" class="cross">
    <path d="M636 62 v10 M631 67 h10"/>
    <path d="M690 300 v8 M686 304 h8"/>
  </g>
  <g stroke="#f472b6" stroke-width="1.2" class="cross" style="animation-delay:-1.4s">
    <path d="M612 226 v8 M608 230 h8"/>
    <path d="M700 60 v8 M696 64 h8"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" opacity="0.9">
    <path d="M26 54 V30 H50"/>
    <path d="M1050 54 V30 H1026"/>
    <path d="M26 320 V334 H50"/>
    <path d="M1050 320 V334 H1026"/>
  </g>

  <!-- top status bar -->
  <text class="fps" x="34" y="24" font-size="15" fill="#8b95ad" letter-spacing="1">[ YHT20927 :: BRIDGE_NEXUS ]</text>
  <text class="fps" x="760" y="24" font-size="15" fill="#8b95ad" letter-spacing="1">PORT 443</text>
  <circle class="dot" cx="876" cy="20" r="3" fill="#4ade80"/>
  <text class="fps" x="886" y="24" font-size="15" fill="#4ade80" letter-spacing="1">SECURE</text>
  <text class="fps" x="1028" y="24" font-size="15" fill="#8b95ad" letter-spacing="0">ID@0x0A</text>

  <!-- glitch copies -->
  <text class="fps ga" x="72" y="150" font-size="120" font-weight="800" fill="#22d3ee" opacity="0.7" filter="url(#glowT)">YHT20927</text>
  <text class="fps gb" x="72" y="150" font-size="120" font-weight="800" fill="#f472b6" opacity="0.7" filter="url(#glowT)">YHT20927</text>
  <text class="fps tf" x="72" y="150" font-size="120" font-weight="800" fill="url(#titleG)" filter="url(#soft)">YHT20927</text>
  <!-- moving specular sheen -->
  <text class="fps" x="72" y="150" font-size="120" font-weight="800" fill="url(#sheen)" opacity="0.55">YHT20927</text>

  <!-- neon underline -->
  <rect x="74" y="168" width="560" height="4" rx="2" fill="url(#glowL)"/>
  <rect class="dash" x="74" y="168" width="560" height="2" rx="1" fill="#e2e8f0" opacity="0.6"/>
  <circle r="3" fill="#ffffff" filter="url(#glowT)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M74 170 H634"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.86;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- subtitle -->
  <text class="fps" x="74" y="212" font-size="30" letter-spacing="2" fill="#f472b6" font-weight="600">BRIDGE FRAMEWORK</text>
  <text class="fps" x="74" y="246" font-size="22" fill="#cbd5e1" letter-spacing="1">REAL BROWSER  &#8596;  BRIDGE-SERVER  &#8596;  LLM AGENT</text>
  <text class="fps" x="74" y="278" font-size="17" fill="#8b95ad">userscript-driven automation · anti-detect · humanized persona</text>
  <rect x="714" y="262" width="9" height="20" fill="#e2e8f0" class="blink"/>

  <!-- right signal monitor -->
  <g transform="translate(852,130)">
    <circle r="76" fill="url(#eqGlow)"/>
    <circle r="76" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-dasharray="1.5 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle r="56" fill="none" stroke="#a78bfa" stroke-opacity="0.12"/>
    <text class="fps" x="0" y="-84" text-anchor="middle" font-size="13" fill="#5b6478" letter-spacing="1">SIGNAL.MONITOR</text>
    <g fill="#22d3ee" filter="url(#soft)">
      <rect class="eq-bar" x="-44" y="20" width="7" height="44" rx="2"/>
      <rect class="eq-bar" x="-30" y="8"  width="7" height="56" rx="2" style="animation-delay:-0.2s"/>
      <rect class="eq-bar" x="-16" y="-4" width="7" height="68" rx="2" style="animation-delay:-0.4s"/>
      <rect class="eq-bar" x="-2"  y="12" width="7" height="52" rx="2" style="animation-delay:-0.6s"/>
      <rect class="eq-bar" x="12"  y="-8" width="7" height="72" rx="2" style="animation-delay:-0.1s"/>
      <rect class="eq-bar" x="26"  y="10" width="7" height="54" rx="2" style="animation-delay:-0.5s"/>
      <rect class="eq-bar" x="40"  y="20" width="7" height="44" rx="2" style="animation-delay:-0.3s"/>
    </g>
    <text class="fps" x="0" y="86" text-anchor="middle" font-size="29" font-weight="800" fill="#67e8f9" filter="url(#glowStar)">398&#9733;</text>
    <text class="fps" x="0" y="106" text-anchor="middle" font-size="11" fill="#5b6478" letter-spacing="1">STARS SYNCED</text>
    <text class="fps" x="0" y="132" text-anchor="middle" font-size="13" fill="#f0abfc">&#9733; TOP REPO · douyin-cli · 248</text>
  </g>

  <!-- stat chips bottom-right -->
  <g class="fps">
    <g class="chip"><rect x="660" y="286" width="96" height="28" rx="6" fill="#111527" stroke="#f472b6" stroke-width="1.4"/><text x="708" y="305" text-anchor="middle" font-size="12.5" fill="#f472b6">68 FORKS</text></g>
    <g class="chip" style="animation-delay:-0.6s"><rect x="762" y="286" width="96" height="28" rx="6" fill="#111527" stroke="#a78bfa" stroke-width="1.4"/><text x="810" y="305" text-anchor="middle" font-size="12.5" fill="#a78bfa">10 REPOS</text></g>
    <g class="chip" style="animation-delay:-1.1s"><rect x="864" y="286" width="96" height="28" rx="6" fill="#111527" stroke="#22d3ee" stroke-width="1.4"/><text x="912" y="305" text-anchor="middle" font-size="11.5" fill="#22d3ee">13 FOLLOWERS</text></g>
    <g class="chip" style="animation-delay:-1.6s"><rect x="966" y="286" width="96" height="28" rx="6" fill="#111527" stroke="#4ade80" stroke-width="1.4"/><text x="1014" y="305" text-anchor="middle" font-size="12.5" fill="#4ade80">239 COMMITS</text></g>
  </g>

  <!-- bottom telemetry ticker -->
  <text class="fps" x="74" y="331" font-size="11" fill="#475069" letter-spacing="0.6">// 10 repos · 5 platforms · 398 stars · 68 forks · 239 commits · real browsers, not simulation</text>
</svg>
