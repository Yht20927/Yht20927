<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d16"/><stop offset="0.5" stop-color="#0d1020"/><stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radarBg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0f2a36" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#07141c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#061018" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <style>
    .fps{font-family:"Fira Code","Cascadia Code",Menlo,Consolas,monospace}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes blink2{0%,100%{opacity:1}30%{opacity:0.3}60%{opacity:1}80%{opacity:0.2}}
    @keyframes flick{0%,92%,100%{opacity:1}95%{opacity:0.6}97%{opacity:1}}
    @keyframes bars{0%,100%{transform:scaleY(0.15)}50%{transform:scaleY(1)}}
    .blink{animation:blink 1s steps(1) infinite}
    .blink2{animation:blink2 1.7s ease-in-out infinite}
    .flick{animation:flick 6s steps(1) infinite}
    .eq{transform-box:fill-box;transform-origin:center bottom;animation:bars 1.1s ease-in-out infinite}
  </style>

  <rect width="1100" height="470" fill="url(#bg)"/>

  <!-- corner brackets -->
  <g stroke="#a78bfa" stroke-width="3" fill="none" opacity="0.7">
    <path d="M24 60 V40 H44"/><path d="M456 60 V40 H436"/>
    <path d="M24 410 V430 H44"/><path d="M456 410 V430 H436"/>
  </g>

  <!-- left header -->
  <text class="fps" x="34" y="30" font-size="17" letter-spacing="2" fill="#f472b6" font-weight="700">NODE SCAN</text>
  <circle class="blink" cx="148" cy="26" r="4" fill="#4ade80"/>
  <text class="fps" x="158" y="30" font-size="15" fill="#4ade80" letter-spacing="1">LIVE</text>

  <!-- radar disc -->
  <g transform="translate(250,255)">
    <circle r="178" fill="url(#radarBg)" stroke="#0e3a4a" stroke-width="1.4"/>
    <circle r="178" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
    <circle r="133" fill="none" stroke="#22d3ee" stroke-opacity="0.22"/>
    <circle r="89"  fill="none" stroke="#22d3ee" stroke-opacity="0.22"/>
    <circle r="44"  fill="none" stroke="#22d3ee" stroke-opacity="0.28"/>
    <circle r="4" fill="#22d3ee"/>
    <g stroke="#22d3ee" stroke-opacity="0.10">
      <line x1="-178" y1="0" x2="178" y2="0"/>
      <line x1="0" y1="-178" x2="0" y2="178"/>
      <line x1="-126" y1="-126" x2="126" y2="126"/>
      <line x1="-126" y1="126" x2="126" y2="-126"/>
    </g>

    <!-- rotating sweep -->
    <g>
      <path d="M0 0 L0 -178 A178 178 0 0 1 36 -174 Z" fill="url(#sweep)" filter="url(#blurS)"/>
      <line x1="0" y1="0" x2="0" y2="-176" stroke="#67e8f9" stroke-width="2.4" filter="url(#blurS)"/>
      <line x1="0" y1="0" x2="0" y2="-178" stroke="#a5f3fc" stroke-width="1"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.6s" repeatCount="indefinite"/>
    </g>

    <!-- blips -->
    <g>
      <circle cx="58" cy="-118" r="3.4" fill="#f472b6"/>
      <circle cx="58" cy="-118" fill="none" stroke="#f472b6" stroke-width="1.6"><animate attributeName="r" from="4" to="30" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.9" to="0" dur="2s" repeatCount="indefinite"/></circle>
      <text x="78" y="-114" class="fps" font-size="12" fill="#f0abfc">douyin</text>
    </g>
    <g>
      <circle cx="-98" cy="-66" r="3.4" fill="#a78bfa"/>
      <circle cx="-98" cy="-66" fill="none" stroke="#a78bfa" stroke-width="1.6"><animate attributeName="r" from="4" to="26" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.9" to="0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <text x="-124" y="-70" class="fps" font-size="12" fill="#c4b5fd">xhs</text>
    </g>
    <g>
      <circle cx="-40" cy="118" r="3.4" fill="#22d3ee"/>
      <circle cx="-40" cy="118" fill="none" stroke="#22d3ee" stroke-width="1.6"><animate attributeName="r" from="4" to="26" dur="2.2s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.9" to="0" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <text x="-64" y="136" class="fps" font-size="12" fill="#67e8f9">boss</text>
    </g>
    <g>
      <circle cx="118" cy="40" r="3.2" fill="#4ade80"/>
      <circle cx="118" cy="40" fill="none" stroke="#4ade80" stroke-width="1.6"><animate attributeName="r" from="4" to="22" dur="2.6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.9" to="0" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="136" y="46" class="fps" font-size="12" fill="#86efac">ths</text>
    </g>
    <g>
      <circle cx="-120" cy="-6" r="3" fill="#fbbf24"/>
      <circle cx="-120" cy="-6" fill="none" stroke="#fbbf24" stroke-width="1.6"><animate attributeName="r" from="3" to="20" dur="2.8s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.9" to="0" dur="2.8s" begin="1.6s" repeatCount="indefinite"/></circle>
      <text x="-138" y="6" class="fps" font-size="12" fill="#fde68a">tiktok</text>
    </g>
  </g>

  <!-- radar bottom status -->
  <g class="fps" font-size="16">
    <text x="72" y="458" fill="#8b95ad">SIGNAL <tspan fill="#e2e8f0" font-weight="800">151&#9733;</tspan></text>
    <text x="190" y="458" fill="#8b95ad">LINK <tspan fill="#4ade80">UP</tspan></text>
    <text x="288" y="458" fill="#8b95ad">NODES <tspan class="blink2" fill="#22d3ee">5/5</tspan></text>
    <text x="398" y="458" fill="#8b95ad">SCAN <tspan class="blink2" fill="#f472b6">&#9608;</tspan></text>
  </g>

  <!-- right: platform matrix -->
  <text class="fps" x="520" y="66" font-size="17" letter-spacing="2" fill="#22d3ee" font-weight="700">PLATFORM MATRIX <tspan fill="#5b6478" font-size="14">// 5 nodes online</tspan></text>

  <g class="fps" font-family="monospace">
    <!-- douyin-cli -->
    <g class="flick">
      <rect x="520" y="84" width="560" height="58" rx="8" fill="#0e1426" stroke="#f472b6" stroke-opacity="0.55" stroke-width="1.4"/>
      <circle class="blink2" cx="546" cy="113" r="5" fill="#f472b6"/>
      <text x="564" y="108" font-size="17" fill="#f0abfc" font-weight="700">douyin-cli</text>
      <text x="564" y="128" font-size="13" fill="#8b95ad">全自动评论管理 &#183; 搜索 &#183; 嵌套回复 &#183; AI 回复</text>
      <text x="1064" y="112" text-anchor="end" font-size="17" fill="#f472b6" font-weight="700">56&#9733;</text>
    </g>
    <g style="animation-delay:-1.2s">
      <rect x="520" y="152" width="560" height="58" rx="8" fill="#0e1426" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.4"/>
      <circle class="blink2" cx="546" cy="181" r="5" fill="#22d3ee"/>
      <text x="564" y="176" font-size="17" fill="#67e8f9" font-weight="700">xiaohongshu-cli</text>
      <text x="564" y="196" font-size="13" fill="#8b95ad">话题互动 &#183; 内容发现 &#183; 拟人化评论生成</text>
      <text x="1064" y="180" text-anchor="end" font-size="17" fill="#22d3ee" font-weight="700">28&#9733;</text>
    </g>
    <g style="animation-delay:-2.2s">
      <rect x="520" y="220" width="560" height="58" rx="8" fill="#0e1426" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.4"/>
      <circle class="blink2" cx="546" cy="249" r="5" fill="#a78bfa"/>
      <text x="564" y="244" font-size="17" fill="#c4b5fd" font-weight="700">BossZhipin-cli</text>
      <text x="564" y="264" font-size="13" fill="#8b95ad">搜索职位 &#183; 智能匹配 &#183; 批量打招呼 &#183; LLM 招呼语</text>
      <text x="1064" y="248" text-anchor="end" font-size="17" fill="#a78bfa" font-weight="700">15&#9733;</text>
    </g>
    <g style="animation-delay:-3s">
      <rect x="520" y="288" width="560" height="58" rx="8" fill="#0e1426" stroke="#4ade80" stroke-opacity="0.45" stroke-width="1.4"/>
      <circle class="blink2" cx="546" cy="317" r="5" fill="#4ade80"/>
      <text x="564" y="312" font-size="17" fill="#86efac" font-weight="700">ths-cli</text>
      <text x="564" y="332" font-size="13" fill="#8b95ad">同花顺工具 &#183; 基本数据服务 &#183; 简易量化</text>
      <text x="1064" y="316" text-anchor="end" font-size="17" fill="#4ade80" font-weight="700">6&#9733;</text>
    </g>
    <g style="animation-delay:-3.8s">
      <rect x="520" y="356" width="560" height="58" rx="8" fill="#0e1426" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.4"/>
      <circle class="blink2" cx="546" cy="385" r="5" fill="#fbbf24"/>
      <text x="564" y="380" font-size="17" fill="#fde68a" font-weight="700">tiktok-cli</text>
      <text x="564" y="400" font-size="13" fill="#8b95ad">Bridge 驱动 TikTok 评论全自动管理</text>
      <text x="1064" y="384" text-anchor="end" font-size="17" fill="#fbbf24" font-weight="700">2&#9733;</text>
    </g>
  </g>

  <!-- right bottom status -->
  <text class="fps" x="520" y="444" font-size="14" fill="#5b6478">NODES <tspan fill="#4ade80">5/5</tspan>  &#183;  RTT <tspan fill="#22d3ee">12ms</tspan>  &#183;  AGENT <tspan class="blink" fill="#f472b6">&#9608;</tspan></text>
</svg>
