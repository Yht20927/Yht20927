<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="120" viewBox="0 0 1100 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d16"/><stop offset="0.5" stop-color="#0d1020"/><stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <style>
    .fps{font-family:"Fira Code","Cascadia Code",Menlo,Consolas,monospace}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes comet{0%{transform:translateX(-60px)}100%{transform:translateX(1160px)}}
    @keyframes scan{0%{opacity:0.15}50%{opacity:0.55}100%{opacity:0.15}}
    .blink{animation:blink 1s steps(1) infinite}
    .comet{animation:comet 2.8s linear infinite}
    .sc{animation:scan 3s ease-in-out infinite}
  </style>

  <rect width="1100" height="120" fill="url(#bg)"/>
  <!-- corner brackets -->
  <g stroke="#a78bfa" stroke-width="3" fill="none" opacity="0.6">
    <path d="M22 40 V26 H36"/><path d="M1078 40 V26 H1064"/>
    <path d="M22 92 V106 H36"/><path d="M1078 92 V106 H1064"/>
  </g>

  <!-- center text -->
  <text class="fps" x="550" y="52" text-anchor="middle" font-size="24" letter-spacing="3" fill="#e2e8f0" font-weight="700">REAL BROWSERS <tspan fill="#22d3ee">.</tspan> NOT SIMULATION <tspan fill="#f472b6">.</tspan> LIVE ON GITHUB</text>

  <!-- pulsing scan bar behind text -->
  <rect class="sc" x="300" y="30" width="500" height="34" rx="17" fill="#a78bfa" opacity="0.08"/>

  <rect class="blink" x="798" y="40" width="10" height="22" fill="#22d3ee"/>

  <!-- traveling dot on underline -->
  <line x1="180" y1="82" x2="920" y2="82" stroke="#1e2b45" stroke-width="2"/>
  <line x1="180" y1="82" x2="920" y2="82" stroke="url(#bar)" stroke-width="2"/>
  <circle class="comet" r="3.4" cy="82" cx="180" fill="#22d3ee"/>

  <text class="fps" x="550" y="106" text-anchor="middle" font-size="14" fill="#5b6478" letter-spacing="2">bridge-framework&#183;userscript&#183;wss&#183;llm</text>
</svg>
